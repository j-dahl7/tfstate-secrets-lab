name: Terraform Security Scan

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - '**/.terraform.lock.hcl'
      - '.terraform-version'
      - 'scripts/**'
      - 'tests/**'
      - 'trivy.yaml'
      - '.github/workflows/terraform-security.yml'
  push:
    branches: [main]
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - '**/.terraform.lock.hcl'
      - '.terraform-version'
      - 'scripts/**'
      - 'tests/**'
      - 'trivy.yaml'
      - '.github/workflows/terraform-security.yml'

permissions:
  contents: read

env:
  TF_VERSION: "1.14.9"

jobs:
  security-contract:
    name: State and source security contract
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run offline unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Enforce secure-example source policy
        run: python3 scripts/check_terraform_security.py

      - name: Require a clean fixture to pass
        run: bash scripts/leak-check.sh --state-file tests/fixtures/clean-state.json

      - name: Require a leaky fixture to fail with finding status
        shell: bash
        run: |
          expected_status=1
          set +e
          bash scripts/leak-check.sh --state-file tests/fixtures/leaky-state.json
          actual_status=$?
          set -e
          if [[ "$actual_status" -ne "$expected_status" ]]; then
            echo "Expected leak checker status $expected_status; got $actual_status" >&2
            exit 1
          fi

  terraform-validate:
    name: Validate all four examples
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Initialize and validate every example
        shell: bash
        run: |
          terraform fmt -check -recursive
          for directory in \
            00-bad-secret-in-state \
            01-good-write-only \
            02-azure-traditional \
            03-azure-write-only; do
            terraform -chdir="$directory" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$directory" validate
          done

  trivy-secure-examples:
    name: Enforce Trivy findings (${{ matrix.directory }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        directory:
          - 01-good-write-only
          - 03-azure-write-only

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Scan secure example and fail on findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ matrix.directory }}
          trivy-config: trivy.yaml
          severity: HIGH,CRITICAL
          exit-code: '1'
          version: v0.70.0

      - name: Verify actual Trivy raw-config wiring
        run: python3 scripts/check_trivy_config.py
